# Load UCI configuration
confdir /var/etc/chrony.d

# Load NTP servers from DHCP if enabled in UCI
sourcedir /var/run/chrony-dhcp

# GPS time from gpsd over shared memory. A USB puck has no PPS, so its time
# jitters by tens of milliseconds: the large delay makes chrony prefer NTP
# servers when they are reachable and fall back to GPS when they are not.
refclock SHM 0 refid GPS poll 4 precision 1e-1 offset 0.0 delay 0.5

# Log clock errors above 0.5 seconds
logchange 0.5

# Don't log client accesses
noclientlog

# Mark the system clock as synchronized
rtcsync

# Record the clock's drift
driftfile /var/run/chrony/drift

# Save NTS keys and cookies
ntsdumpdir /var/run/chrony
